<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>How You Find Your Footing</title>
<style>
  :root { --bg:#fcfcfb; --surface:#fff; --ink:#0b0b0b; --ink-2:#52514e; --line:#e4e3df; --accent:#2a78d6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1a1a19; --surface:#232321; --ink:#f0efec; --ink-2:#c3c2b7; --line:#3a3a37; --accent:#3987e5; } }
  :root[data-theme="dark"] { --bg:#1a1a19; --surface:#232321; --ink:#f0efec; --ink-2:#c3c2b7; --line:#3a3a37; --accent:#3987e5; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px; }
  form { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:24px; }
  h1 { font-size:1.4rem; margin:0 0 4px; } p { color:var(--ink-2); margin:0 0 16px; }
  input { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); margin-bottom:12px; }
  button { width:100%; font:inherit; font-weight:600; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  #msg { color:#c2410c; min-height:1.5em; margin:12px 0 0; }
</style>
</head>
<body>
<form id="f">

  <input id="pw" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password">
  <button type="submit">Open</button>
  <p id="msg" role="status"></p>
</form>

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "Opening...";
  try {
    const secret = document.getElementById("user").value.trim().toLowerCase() + "\n" + document.getElementById("pw").value;
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(DATA.salt), iterations: DATA.iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

    msg.textContent = "That username and password didn't work. Please try again.";
